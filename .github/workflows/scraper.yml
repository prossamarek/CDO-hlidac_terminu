name: CDO Deadline Scraper

on:
  schedule:
    - cron: '0 */4 * * *' # Běží každé 4 hodiny
  workflow_dispatch: # Pro ruční spuštění

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Stáhnout kód z repozitáře
        uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Nainstalovat knihovny
        run: pip install -r requirements.txt

      - name: Spustit CDO Monitor
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python cdo_monitor.py

      - name: Uložit aktualizovanou databázi (db.json)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add db.json || true
          git commit -m "Autocommit: aktualizace stavu deadlinů" || exit 0
          git push
